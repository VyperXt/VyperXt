# Sobe tudo: CRM + PostgreSQL + Redis + Evolution API (WhatsApp) + n8n
#   cp .env.example .env   (e preencha)
#   docker compose up -d --build
name: vyper-crm

x-db: &db
  POSTGRES_USER: ${POSTGRES_USER:-crm}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  # WhatsApp via QR code — painel em http://localhost:8080/manager
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Só nesta máquina: o CRM fala com a Evolution pela rede interna do Docker.
    # Para abrir o gerenciador de outro computador, use um túnel SSH (ssh -L 8080:localhost:8080 ...).
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Vyper CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances

  # Automações — http://localhost:5678
  n8n:
    image: n8nio/n8n:2.41.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Em produção atrás de um proxy: N8N_PUBLISH=127.0.0.1:5678 no .env
      - "${N8N_PUBLISH:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-crm}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY no .env}
      # Endereço público do n8n (usado nas URLs de webhook e formulários)
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      # Escuta em IPv4 (muitos Dockers não têm IPv6 e o n8n não sobe sem isso)
      N8N_LISTEN_ADDRESS: 0.0.0.0
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      # Permite login por http://localhost (sem HTTPS). Em produção, use HTTPS e remova.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8ndata:/home/node/.n8n

  # O CRM (API + painel) — http://localhost:3000
  crm:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Em produção atrás de um proxy: CRM_PUBLISH=127.0.0.1:3000 no .env (só o proxy alcança o CRM)
      - "${CRM_PUBLISH:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm}@postgres:5432/crm
      # Endereços dentro da rede do Docker
      PUBLIC_URL: ${PUBLIC_URL:-http://crm:3000}
      EVOLUTION_API_URL: http://evolution:8080
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/crm-eventos}
    volumes:
      # Estado do Claude Code (CLAUDE_CODE_ENABLED=true ou AI_PROVIDER=claude-code). O login vem de
      # CLAUDE_CODE_OAUTH_TOKEN no .env.
      - claude_home:/home/node/.claude

volumes:
  pgdata:
  redisdata:
  evolution_instances:
  n8ndata:
  claude_home:
